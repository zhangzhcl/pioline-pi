[package]
name = "pipline-workflow-code-worker"
version = "0.1.0"
edition = "2021"
build = "build.rs"
autobins = false

[[bin]]
name = "workflow-code-worker"
path = "src/main.rs"
required-features = ["workflow-code-runner-prototype"]

[build-dependencies]
cc = "1"

[dependencies]
rquickjs = { version = "=0.14.0", features = ["futures"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
workflow-code-runner-prototype = ["dep:rquickjs"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_Console",
] }
