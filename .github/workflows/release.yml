name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64) host build.
          - os: macos-15
            pi_target_platform: darwin-arm64
            cargo_target: aarch64-apple-darwin
          # macOS Intel (x64) native build. macos-15 is Apple Silicon; use the
          # current explicit Intel label for a native x86_64 release artifact.
          - os: macos-15-intel
            pi_target_platform: darwin-x64
            cargo_target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          # Linux x86_64 is split across two runners:
          #
          #  * deb/rpm on 22.04 -- these link against the *host* WebKitGTK, so
          #    building on jammy keeps the glibc floor low enough that Debian 12
          #    / Ubuntu 22.04 can still install the packages.
          #  * AppImage on 24.04 -- this one *bundles* WebKitGTK via linuxdeploy,
          #    and jammy's 4.1 (~2.44) is too old for current distros: on
          #    Fedora 43 the bundled JavaScriptCore segfaults from the GTK main
          #    loop because the web process ends up binding a mix of the stale
          #    bundled libs and the host's much newer ICU/libsoup/glibc. 24.04's
          #    WebKitGTK is close enough to what modern distros ship to avoid
          #    that. The AppImage's audience is bleeding-edge distros with no
          #    matching deb/rpm, so its higher glibc floor is an acceptable
          #    trade -- older systems have apt/dnf and take the packages.
          - os: ubuntu-22.04
            pi_target_platform: linux-x64
            cargo_target: x86_64-unknown-linux-gnu
            linux_bundles: deb,rpm
          - os: ubuntu-24.04
            pi_target_platform: linux-x64
            cargo_target: x86_64-unknown-linux-gnu
            linux_bundles: appimage
          - os: ubuntu-24.04-arm
            pi_target_platform: linux-arm64
            cargo_target: aarch64-unknown-linux-gnu
            linux_bundles: deb,rpm,appimage
          - os: windows-2022
            pi_target_platform: windows-x64
            cargo_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            pi_target_platform: windows-arm64
            cargo_target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    env:
      PIPLINE_RELEASE_REPOSITORY: ${{ github.repository }}
      PIPLINE_CARGO_TARGET: ${{ matrix.cargo_target }}
      PIPLINE_UPDATER_PUBLIC_KEY: ${{ vars.PIPLINE_UPDATER_PUBLIC_KEY }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Mitigate intermittent crates.io download failures on CI runners
      # ("curl failed [16] Error in the HTTP2 framing layer"). Disabling
      # HTTP/2 multiplexing forces cargo's curl downloader back to HTTP/1.1,
      # which avoids the flaky HTTP2 framing-layer errors. The sparse
      # protocol + retries make transient registry hiccups self-healing.
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_HTTP_CHECK_REVOKE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure updater for this Pipline repository
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/write-tauri-release-config.js

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Cache the cargo registry + git db + build artifacts. This both speeds
      # up builds and makes transient crates.io download failures far less
      # likely to break a release (the crate is usually already on disk from a
      # prior run).
      #
      # Two things a hand-rolled `actions/cache` step here got wrong, each of
      # which on its own reduced every release to a from-scratch compile of the
      # whole dependency graph (~11-13 min of the ~15 min wall time):
      #
      #  1. It cached `src-tauri/target`, which does not exist. The root
      #     `.cargo/config.toml` sets `target-dir = "target"`, and cargo
      #     resolves that relative to the config file -- so build output lands
      #     in the *repo root* `target/`. The saved caches were ~40 MB of bare
      #     registry with no compiled artifacts in them at all.
      #  2. Actions caches are scoped by ref and this workflow only runs on
      #     tags, so every cache it saved landed in a `refs/tags/vX` scope that
      #     no later run can read (a run sees its own ref plus the default
      #     branch, nothing else). A 100% miss rate, forever, and every run
      #     added another few GB of unreadable entries to the repo's 10 GB
      #     cache quota.
      #
      # Hence: `../target` relative to the `src-tauri` workspace root, and
      # saving happens in cache-warm.yml on main -- the one scope every tag run
      # can restore from. `save-if` keeps tag runs read-only so they stop
      # filling the quota with unreadable entries.
      - name: Restore cargo + build artifacts cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target
          # Must stay identical to cache-warm.yml, along with the CARGO_* env
          # above: rust-cache hashes every CARGO*/RUST* variable into the key,
          # so a difference in either place silently stops the cache resolving.
          shared-key: picot-release-${{ matrix.os }}-${{ matrix.rust_target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          WEBKIT_DEV_PKG="libwebkit2gtk-4.1-dev"
          if ! apt-cache show "$WEBKIT_DEV_PKG" >/dev/null 2>&1; then
            WEBKIT_DEV_PKG="libwebkit2gtk-4.0-dev"
          fi
          sudo apt-get install -y \
            desktop-file-utils \
            "$WEBKIT_DEV_PKG" \
            libappindicator3-dev \
            librsvg2-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            rpm \
            patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify updater signing key pair
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PIPLINE_UPDATER_PUBLIC_KEY: ${{ vars.PIPLINE_UPDATER_PUBLIC_KEY }}
        run: node scripts/verify-tauri-updater-keypair.js

      # Cache embedded release assets. Lockfile changes invalidate the cache so
      # a build never silently ships a stale Pi binary or terminal font.
      - name: Cache embedded release downloads
        uses: actions/cache@v5
        with:
          path: |
            .cache/pi-binaries
            .cache/terminal-fonts
            .cache/cjk-fonts
          key: embedded-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/pi-version.json', 'scripts/terminal-font-version.json', 'scripts/cjk-font-version.json') }}

      - name: Fetch embedded pi binary
        env:
          PI_TARGET_PLATFORM: ${{ matrix.pi_target_platform }}
        run: bun run fetch:pi

      # Sanity-check that the embedded binary actually runs. We can only do
      # this when the embedded binary's architecture matches the runner's:
      # the macos-15 job cross-compiles an x86_64 (darwin-x64) binary on an
      # Apple Silicon runner, which would SIGILL ("Illegal instruction",
      # exit 132) if executed here. That cross-built binary is exercised on
      # its own native runner instead. `matrix.rust_target` is only set for
      # the cross-compile job, so its absence means host arch == target arch.
      - name: Verify embedded pi runs (Unix)
        if: runner.os != 'Windows' && matrix.rust_target == ''
        run: ./src-tauri/resources/pi/pi --version

      - name: Verify embedded pi runs (Windows)
        if: runner.os == 'Windows' && matrix.rust_target == ''
        run: .\src-tauri\resources\pi\pi.exe --version

      - name: Build pi extensions bundle
        run: bun run build:extensions

      - name: Smoke test embedded Pi RPC and DAG Agent workflow
        run: bun run smoke:pi-rpc

      - name: Smoke test Pi workflow proposal and NodeMeta RPC
        run: bun run smoke:pi-workflow-rpc

      # linuxdeploy walks the whole AppDir and runs `ldd` on every ELF file it
      # finds, including the `pi` binary we ship under `resources/pi`. It
      # tolerates a failing ldd only when the output says "not a dynamic
      # executable" (elf_file.cpp), and otherwise throws an uncaught
      # std::runtime_error -- which aborts the whole bundle:
      #
      #   Deploying dependencies for ELF file .../Picot.AppDir/usr/lib/Picot/pi/pi
      #   terminate called after throwing an instance of 'std::runtime_error'
      #     what():  Failed to run ldd: exited with code 1
      #   ERROR: Failed to run plugin: gtk (exit code: 134)
      #
      # That is the v0.4.3-beta.3 arm64 failure. The x86_64 pi binary is
      # dynamically linked so ldd succeeds there and only arm64 trips it.
      #
      # linuxdeploy resolves `ldd` through PATH, so shim it: pass a successful
      # ldd through untouched, and rewrite a failure into the exact
      # "not a dynamic executable" / exit 1 answer that linuxdeploy's guard is
      # written to absorb, making it log a warning and move on. Only the
      # AppImage target goes through linuxdeploy; deb/rpm never invoke ldd.
      - name: Install ldd shim for linuxdeploy (Linux)
        if: runner.os == 'Linux' && contains(matrix.linux_bundles, 'appimage')
        run: |
          mkdir -p "$RUNNER_TEMP/ldd-shim"
          cat > "$RUNNER_TEMP/ldd-shim/ldd" <<'SH'
          #!/bin/sh
          out=$(/usr/bin/ldd "$@") || {
            printf '\tnot a dynamic executable\n'
            exit 1
          }
          printf '%s\n' "$out"
          SH
          chmod +x "$RUNNER_TEMP/ldd-shim/ldd"
          echo "$RUNNER_TEMP/ldd-shim" >> "$GITHUB_PATH"

      # linuxdeploy also runs `patchelf --set-rpath '$ORIGIN'` on every ELF in
      # the AppDir, `resources/pi/pi` included. patchelf relocates the program
      # headers, which shifts every PT_LOAD file offset -- measured on
      # v0.4.3-beta.5: x86_64 +0x1000, aarch64 +0x10000, and a DT_RUNPATH the
      # upstream binary does not have. `pi` is a self-extracting single-file
      # runtime that seeks its payload at a fixed offset inside
      # /proc/self/exe, so a shifted binary dies instantly and silently
      # (killed by a signal, nothing on stderr). In the app that surfaces as
      # "Pi RPC request failed: ProcessClosed" plus an empty provider list.
      # deb/rpm never invoke linuxdeploy, which is why only AppImage users hit
      # it, and the ldd shim above does not help: it stops dependency
      # deployment, not the rpath rewrite.
      #
      # linuxdeploy looks up patchelf in $PATCHELF before falling back to PATH
      # ("Using patchelf specified in $PATCHELF"), so point it at a shim that
      # forwards everything except a *write* to the bundled pi. Reads still go
      # through so linuxdeploy keeps getting truthful answers.
      - name: Install patchelf shim for linuxdeploy (Linux)
        if: runner.os == 'Linux' && contains(matrix.linux_bundles, 'appimage')
        run: |
          # patchelf itself comes from the "Install Linux dependencies" step.
          mkdir -p "$RUNNER_TEMP/patchelf-shim"
          cat > "$RUNNER_TEMP/patchelf-shim/patchelf" <<'SH'
          #!/bin/sh
          # patchelf's target file is always the final argument.
          for arg in "$@"; do target="$arg"; done
          case "$target" in
            */pi/pi)
              for arg in "$@"; do
                case "$arg" in
                  --set-rpath|--add-rpath|--force-rpath|--remove-rpath|--shrink-rpath|--set-interpreter|--add-needed|--remove-needed|--replace-needed)
                    echo "picot: refusing to rewrite the embedded pi runtime ($target)" >&2
                    exit 0
                    ;;
                esac
              done
              ;;
          esac
          exec /usr/bin/patchelf "$@"
          SH
          chmod +x "$RUNNER_TEMP/patchelf-shim/patchelf"
          echo "PATCHELF=$RUNNER_TEMP/patchelf-shim/patchelf" >> "$GITHUB_ENV"

      - name: Build Tauri app (Linux deb + rpm + AppImage) into release draft
        if: runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Workaround for linuxdeploy/strip failures on modern ELF
          # binaries (e.g. `.relr.dyn`), see tauri#14796.
          NO_STRIP: "true"
          # Signing key for the Tauri updater. Required so the bundler
          # produces `*.sig` files and `latest.json` (the manifest the
          # auto-updater reads from the GitHub release). Configure these
          # one-time in repo Settings → Secrets → Actions. See
          # docs/AUTO_UPDATER.md for how to generate the key pair.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pipline ${{ github.ref_name }}"
          releaseBody: |
            Automated release for `${{ github.ref_name }}`.
            Download the installer for your platform from the assets below.
          # Keep every platform artifact private until all matrix builds and
          # installer smoke gates, including the Windows MSI upgrade, succeed.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # AppImage is the only Linux target the Tauri updater supports, so
          # it is what puts a `linux-*` entry into `latest.json`. It is also
          # the only target that goes through linuxdeploy -- see the ldd shim
          # step above and `NO_STRIP` for the workarounds that keeps alive.
          # `--verbose` keeps linuxdeploy's own stderr in the log instead of
          # tauri-bundler's generic "failed to run linuxdeploy" wrapper.
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.linux_bundles }} --verbose
          # tauri-action will only attach `latest.json` (the updater
          # manifest) when this is `true`. The generated release config
          # enables `bundle.createUpdaterArtifacts` and sets this repository's
          # the release ends up with: installers + `*.sig` files +
          # `latest.json` pinning the URL/signature of each platform
          # bundle. The Tauri updater endpoint then resolves to
          # `https://github.com/.../releases/latest/download/latest.json`.
          updaterJsonPreferNsis: true

      # Guard against the failure this shim exists to prevent: if a future
      # linuxdeploy (or a change to the shim) rewrites the embedded runtime
      # again, fail loudly here instead of shipping an AppImage whose pi dies
      # at startup with no stderr.
      - name: Verify linuxdeploy left the embedded pi untouched (Linux)
        if: runner.os == 'Linux' && contains(matrix.linux_bundles, 'appimage')
        run: |
          set -euo pipefail
          # The cargo target dir is the workspace root, not src-tauri/target.
          # Search rather than hardcode, so a layout change fails loudly here
          # instead of silently skipping the check.
          appimage="$(find "$PWD" -type f -name '*.AppImage' -path '*/bundle/appimage/*' | head -1)"
          if [ -z "$appimage" ]; then
            echo "::error::no AppImage found under $PWD"
            exit 1
          fi
          expected="$(sha256sum "$PWD/src-tauri/resources/pi/pi" | cut -d' ' -f1)"
          workdir="$RUNNER_TEMP/appimage-pi-check"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          chmod +x "$appimage"
          (cd "$workdir" && "$appimage" --appimage-extract 'usr/lib/*/pi/pi' >/dev/null)
          bundled="$(find "$workdir/squashfs-root" -type f -name pi | head -1)"
          if [ -z "$bundled" ]; then
            echo "::error::the AppImage does not contain resources/pi/pi"
            exit 1
          fi
          actual="$(sha256sum "$bundled" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::linuxdeploy modified the embedded pi runtime (expected $expected, got $actual)"
            exit 1
          fi
          echo "embedded pi is byte-identical to upstream ($actual)"

      - name: Build Tauri app into release draft
        if: runner.os != 'Linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing key for the Tauri updater. Required so the bundler
          # produces `*.sig` files and `latest.json` (the manifest the
          # auto-updater reads from the GitHub release). Configure these
          # one-time in repo Settings → Secrets → Actions. See
          # docs/AUTO_UPDATER.md for how to generate the key pair.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization. These are consumed only
          # by macOS Tauri bundling; they are harmless on the Windows matrix
          # rows that share this non-Linux step.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pipline ${{ github.ref_name }}"
          releaseBody: |
            Automated release for `${{ github.ref_name }}`.
            Download the installer for your platform from the assets below.
          # The release is made public only by publish-release after the
          # complete platform matrix and installer gates pass.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # When a Rust target is set (Intel cross-build on an Apple Silicon
          # runner), pass it through so the bundler emits an x86_64 app.
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
          # tauri-action will only attach `latest.json` (the updater
          # manifest) when this is `true`. The generated release config
          # enables `bundle.createUpdaterArtifacts` and sets this repository's
          # the release ends up with: installers + `*.sig` files +
          # `latest.json` pinning the URL/signature of each platform
          # bundle. The Tauri updater endpoint then resolves to
          # `https://github.com/.../releases/latest/download/latest.json`.
          updaterJsonPreferNsis: true

      - name: Download prior stable MSI for upgrade smoke
        id: prior_msi
        if: runner.os == 'Windows' && matrix.cargo_target == 'x86_64-pc-windows-msvc'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/download-prior-msi.ps1 -DestinationPath 'target/previous-msi'

      - name: Smoke test Windows MSI upgrade
        if: runner.os == 'Windows' && matrix.cargo_target == 'x86_64-pc-windows-msvc'
        env:
          PREVIOUS_MSI_PATH: ${{ steps.prior_msi.outputs.path }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'target/release/bundle/msi/*.msi' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one current MSI installer, found $($installers.Count)."
          }
          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_MSI_PATH)) {
            ./scripts/smoke-msi-install.ps1 -MsiPath $installers[0].FullName
          } else {
            ./scripts/smoke-msi-install.ps1 -MsiPath $installers[0].FullName -PreviousMsiPath $env:PREVIOUS_MSI_PATH
          }

      - name: Generate release source dependency SBOM
        if: runner.os != 'Linux'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: pipline-${{ matrix.pi_target_platform }}-build-sbom.spdx.json
          artifact-name: pipline-${{ matrix.pi_target_platform }}-build-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: true
          github-token: ${{ github.token }}

      - name: Generate release embedded Pi runtime SBOM
        if: runner.os != 'Linux'
        uses: anchore/sbom-action@v0
        with:
          file: .cache/pi-runtime-sbom/${{ matrix.pi_target_platform }}/package-lock.json
          format: spdx-json
          output-file: pipline-pi-runtime-${{ matrix.pi_target_platform }}-sbom.spdx.json
          artifact-name: pipline-pi-runtime-${{ matrix.pi_target_platform }}-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: true
          github-token: ${{ github.token }}

      - name: Generate bundled Node runtime SBOM (macOS)
        if: runner.os == 'macOS'
        run: node scripts/node-runtime-sbom.cjs ${{ matrix.pi_target_platform }}

      - name: Create release installer SHA-256 manifest
        if: runner.os != 'Linux'
        env:
          PIPLINE_RELEASE_TARGET: ${{ matrix.pi_target_platform }}
          PIPLINE_CARGO_TARGET: ${{ matrix.cargo_target }}
          PIPLINE_CROSS_TARGET: ${{ matrix.rust_target != '' }}
        shell: bash
        run: node scripts/create-release-checksums.cjs "$PIPLINE_RELEASE_TARGET" "$PIPLINE_CARGO_TARGET" "$PIPLINE_CROSS_TARGET"

      - name: Archive third-party licenses
        if: runner.os == 'Windows'
        env:
          PIPLINE_RELEASE_TARGET: ${{ matrix.pi_target_platform }}
        shell: pwsh
        run: Compress-Archive -Path licenses -DestinationPath "pipline-licenses-$env:PIPLINE_RELEASE_TARGET.zip" -Force

      - name: Archive third-party licenses
        if: runner.os == 'macOS'
        env:
          PIPLINE_RELEASE_TARGET: ${{ matrix.pi_target_platform }}
        shell: bash
        run: tar -czf "pipline-licenses-${PIPLINE_RELEASE_TARGET}.tar.gz" licenses

      - name: Upload release checksums and license archive
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          PIPLINE_RELEASE_TARGET: ${{ matrix.pi_target_platform }}
        shell: pwsh
        run: |
          $assets = @(
            "pipline-$env:PIPLINE_RELEASE_TARGET-SHA256SUMS.txt",
            "pipline-licenses-$env:PIPLINE_RELEASE_TARGET.zip"
          )
          & gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release sidecars." }

      - name: Upload release checksums and license archive
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          PIPLINE_RELEASE_TARGET: ${{ matrix.pi_target_platform }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "pipline-${PIPLINE_RELEASE_TARGET}-SHA256SUMS.txt"
            "pipline-licenses-${PIPLINE_RELEASE_TARGET}.tar.gz"
            "pipline-node-runtime-${PIPLINE_RELEASE_TARGET}-sbom.spdx.json"
          )
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" --clobber

  publish-release:
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish validated release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::expected $GITHUB_REF_NAME to remain a draft until all release gates pass"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag --repo "$GITHUB_REPOSITORY"
          is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::GitHub did not publish $GITHUB_REF_NAME"
            exit 1
          fi

  publish-beta-manifest:
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
    runs-on: ubuntu-22.04
    steps:
      - name: Download prerelease updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern latest.json \
            --dir dist

      - name: Publish beta channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view beta --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create beta \
              --repo "${{ github.repository }}" \
              --title "Pipline Beta Channel" \
              --notes "Mutable updater manifest for Pipline prerelease builds." \
              --prerelease \
              --target "${{ github.sha }}"
          fi
          gh release upload beta dist/latest.json \
            --repo "${{ github.repository }}" \
            --clobber
