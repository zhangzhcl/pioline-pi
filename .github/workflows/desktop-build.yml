name: Desktop build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows quality gates
            os: windows-2022
          - name: macOS quality gates
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests and Tauri permission checks
        run: bun run test

      - name: Run Rust checks
        run: bun run check:rust

  build:
    name: ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer (Windows Server 2022 CI)
            os: windows-2022
            pi_target: windows-x64
            cargo_target: x86_64-pc-windows-msvc
            tauri_args: --bundles msi,nsis
            artifacts: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - name: macOS 11+ Apple Silicon
            os: macos-15
            pi_target: darwin-arm64
            cargo_target: aarch64-apple-darwin
            tauri_args: --bundles dmg
            artifacts: target/release/bundle/dmg/*.dmg
          - name: macOS 11+ Intel
            os: macos-15-intel
            pi_target: darwin-x64
            cargo_target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles dmg
            artifacts: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      PI_TARGET_PLATFORM: ${{ matrix.pi_target }}
      PIPLINE_CARGO_TARGET: ${{ matrix.cargo_target }}
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Intel macOS target
        if: matrix.rust_target != ''
        run: rustup target add x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            .cache/pi-binaries
            .cache/node-runtime
            .cache/pi-runtime-license-packages
            .cache/terminal-fonts
            .cache/cjk-fonts
          key: desktop-assets-${{ runner.os }}-${{ runner.arch }}-${{ matrix.pi_target }}-${{ hashFiles('scripts/pi-version.json', 'scripts/node-runtime-version.json', 'scripts/terminal-font-version.json', 'scripts/cjk-font-version.json') }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop installer
        run: bun run tauri build ${{ matrix.tauri_args }}

      - name: Verify MSI upgrade identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'target/release/bundle/msi/*.msi' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one MSI installer, found $($installers.Count)."
          }
          ./scripts/check-msi-upgrade-code.ps1 -MsiPath $installers[0].FullName

      - name: Smoke test Windows MSI install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'target/release/bundle/msi/*.msi' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one MSI installer, found $($installers.Count)."
          }
          ./scripts/smoke-msi-install.ps1 -MsiPath $installers[0].FullName

      - name: Smoke test Windows NSIS install, launch, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'target/release/bundle/nsis/*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)."
          }
          ./scripts/smoke-nsis-install.ps1 -InstallerPath $installers[0].FullName

      - name: Smoke test embedded Pi RPC and DAG Agent workflow
        run: bun run smoke:pi-rpc

      - name: Smoke test embedded Pi through Host WebSocket
        run: cargo test --manifest-path src-tauri/Cargo.toml real_pi_websocket_smoke -- --ignored --nocapture

      - name: Smoke test Pi workflow proposal through Host WebSocket
        run: cargo test --manifest-path src-tauri/Cargo.toml real_pi_workflow_proposal_websocket_smoke -- --ignored --nocapture

      - name: Smoke test Pi workflow proposal and NodeMeta RPC
        run: bun run smoke:pi-workflow-rpc

      - name: Generate dependency SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: pipline-${{ matrix.pi_target }}-build-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate embedded Pi runtime dependency SBOM
        uses: anchore/sbom-action@v0
        with:
          file: .cache/pi-runtime-sbom/${{ matrix.pi_target }}/package-lock.json
          format: spdx-json
          output-file: pipline-pi-runtime-${{ matrix.pi_target }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate bundled Node runtime SBOM
        if: runner.os == 'macOS'
        run: node scripts/node-runtime-sbom.cjs ${{ matrix.pi_target }}

      - name: Create installer SHA-256 manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msiInstallers = @(Get-ChildItem -Path 'target/release/bundle/msi/*.msi' -File)
          $nsisInstallers = @(Get-ChildItem -Path 'target/release/bundle/nsis/*.exe' -File)
          if ($msiInstallers.Count -ne 1 -or $nsisInstallers.Count -ne 1) {
            throw "Expected one MSI and one NSIS installer, found $($msiInstallers.Count) MSI and $($nsisInstallers.Count) NSIS files."
          }
          $installers = @($msiInstallers) + @($nsisInstallers)
          $root = (Get-Location).Path
          $lines = foreach ($installer in $installers) {
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relativePath = [IO.Path]::GetRelativePath($root, $installer.FullName).Replace('\', '/')
            "$hash  $relativePath"
          }
          Set-Content -LiteralPath "pipline-${{ matrix.pi_target }}-SHA256SUMS.txt" -Value $lines -Encoding utf8

      - name: Create installer SHA-256 manifest (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CARGO_TARGET: ${{ matrix.cargo_target }}
        run: |
          set -euo pipefail
          bundle_root="target/${CARGO_TARGET}/release/bundle"
          if [ "${CARGO_TARGET}" = "aarch64-apple-darwin" ]; then
            bundle_root="target/release/bundle"
          fi
          installers=()
          while IFS= read -r -d '' installer; do
            installers+=("$installer")
          done < <(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print0)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::expected one DMG installer under $bundle_root/dmg, found ${#installers[@]}"
            exit 1
          fi
          shasum -a 256 "${installers[0]}" > "pipline-${{ matrix.pi_target }}-SHA256SUMS.txt"

      - name: Upload Windows installer and dependency SBOM
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pipline-${{ matrix.pi_target }}
          path: |
            ${{ matrix.artifacts }}
            pipline-${{ matrix.pi_target }}-SHA256SUMS.txt
            pipline-${{ matrix.pi_target }}-build-sbom.spdx.json
            pipline-pi-runtime-${{ matrix.pi_target }}-sbom.spdx.json
            licenses/
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS installer and dependency SBOM
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pipline-${{ matrix.pi_target }}
          path: |
            ${{ matrix.artifacts }}
            pipline-${{ matrix.pi_target }}-SHA256SUMS.txt
            pipline-${{ matrix.pi_target }}-build-sbom.spdx.json
            pipline-pi-runtime-${{ matrix.pi_target }}-sbom.spdx.json
            pipline-node-runtime-${{ matrix.pi_target }}-sbom.spdx.json
            licenses/
          if-no-files-found: error
          retention-days: 14
